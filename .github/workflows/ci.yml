name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Build-time env. Real secrets stay in GitHub Secrets and aren't needed for CI.
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      AUTH_URL: http://localhost:3000
      # OIDC vars are inert during build — no live PocketID call happens in CI.
      OIDC_ISSUER_URL: http://localhost:0
      OIDC_CLIENT_ID: ci-placeholder
      OIDC_CLIENT_SECRET: ci-placeholder
      STORAGE_DIR: /tmp/atlas-documents
      STORAGE_MAX_BYTES: '20971520'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate ephemeral AUTH_SECRET
        # Per-run rather than a committed static value. Real production
        # AUTH_SECRET is provided via deployment env, never from CI.
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET"
          echo "AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare storage dir
        run: mkdir -p "$STORAGE_DIR"

      - name: Run migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      # The floating-time model (ADR-0014/0016) makes date logic
      # UTC-deterministic, but CI runners default to UTC — so a fixture
      # or render path that accidentally leans on the runner's zone
      # passes here yet skews on any other machine. Re-run the suite at
      # the two DST-free extremes of the real offset range so a year- or
      # day-boundary skew in either direction fails the build. Steps in
      # this job (not a separate job) so they reuse the warm install
      # instead of paying another runner spin-up.
      - name: Test (Vitest · TZ +14)
        run: pnpm test
        env:
          TZ: Pacific/Kiritimati

      - name: Test (Vitest · TZ −11)
        run: pnpm test
        env:
          TZ: Pacific/Niue

      - name: Build
        run: pnpm build

      # Advisory only, and last so a slow registry never delays the real
      # gates. `!cancelled()` (not `always()`) keeps it running when
      # typecheck, a test or the build went red — the audit is still worth
      # having on a failing PR — while a cancelled run stops burning minutes
      # here. `continue-on-error` absorbs every non-zero exit: findings, a
      # registry hiccup, the timeout. The job still passes and the step is
      # marked failed, which is the warning we want. Do NOT "simplify" this
      # to `pnpm audit --prod || true` (the step would go green and the
      # marker would be lost), and do NOT reach for `--audit-level`: pnpm
      # filters only what it prints, the exit code stays 1.
      #
      # The accepted-risk baseline lives in package.json
      # `pnpm.auditConfig.ignoreGhsas`, so this goes yellow only on a NEW
      # advisory. Every entry is a finding whose fix we have not adopted
      # yet — the upstream patches exist (next-auth beta.32, @auth/core
      # 0.41.3); it is our upgrade that is deferred, and issue #148 tracks
      # it. Prune an entry the moment we upgrade past it:
      # one left behind silences a real signal. Which entry covers what:
      #
      #   next-auth and @auth/core   GHSA-7rqj-j65f-68wh
      #                              GHSA-xmf8-cvqr-rfgj
      #                              GHSA-x445-f3h2-j279
      #   next-auth only             GHSA-8fpg-xm3f-6cx3
      #   browserslist               GHSA-c83g-rgw3-j3cx
      #                              GHSA-73wf-gq98-2v4g
      #   baseline-browser-mapping   GHSA-w5vr-8v7q-w6rv
      #   @babel/core                GHSA-4x5r-pxfx-6jf8
      - name: Audit (advisory)
        if: ${{ !cancelled() }}
        run: |
          set +e
          pnpm audit --prod 2>&1 | tee "$RUNNER_TEMP/audit.log"
          code=${PIPESTATUS[0]}
          {
            echo '### pnpm audit --prod (advisory)'
            echo ''
            echo '```'
            grep -E '^(No known|[0-9]+ vulnerabilities|Severity)' "$RUNNER_TEMP/audit.log" ||
              tail -n 2 "$RUNNER_TEMP/audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
        continue-on-error: true
        timeout-minutes: 2

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # Full history so gitleaks can scan every commit in a push/PR range.
          fetch-depth: 0
          # This job scans untrusted PR content — don't leave the token in .git/config.
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
